{{define "page_template_edit"}}
<h1 class="page-title"><a href="/config/templates">Templates</a> / {{.Data.Name}} {{template "template_source_badge" .Data}}</h1>
{{if not .Data.Form.ReadOnly}}<div class="card">
  <div class="card-head"><b>Rename</b></div>
  <form hx-post="/web/template/{{.Data.Name}}/rename" hx-target="#flash-container" hx-swap="innerHTML" class="inline-rename">
    <input type="text" name="new_name" value="{{.Data.Name}}" required
           pattern="[A-Za-z0-9._-]+" aria-label="New template name" />
    <button type="submit" class="btn">Rename</button>
  </form>
</div>{{end}}
<div class="card">{{template "config_form" .Data.Form}}</div>
{{end}}
