name: CI

# Runs only when called: prerelease.yml (every PR), unstable.yml (pushes to
# main) and release.yml (tags) gate their builds on it. Direct push/PR
# triggers would run every job twice.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        if: matrix.os == 'macos-latest'
        run: |
          total=$(go tool cover -func=coverage.out | grep ^total: | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          threshold=45
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

      - name: Upload coverage
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run E2E tests
        run: go test -tags=e2e -v -count=1 ./e2e/...

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No credentials: the script builds the image for the runner's arch and
      # exercises it inside throwaway containers. arm64 is built at release
      # time only.
      - name: Smoke test
        run: bash docker/smoke-test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned for determinism — keep in sync with GOLANGCI_VERSION in the Makefile.
          version: v2.12.2

      # Pin gosec to a known-good release. Bump deliberately after reviewing
      # release notes at https://github.com/securego/gosec/releases.
      - name: Install gosec
        env:
          GOSEC_VERSION: v2.25.0
        run: go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}

      - name: Security scan
        # G704 flags c.baseURL+path in internal/mcp/client.go as SSRF-taint,
        # but baseURL is Leo's own daemon endpoint (never user-supplied).
        run: gosec -quiet -exclude=G104,G204,G304,G306,G602,G702,G703,G704 ./...
