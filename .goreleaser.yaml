version: 2

builds:
  - id: leo
    main: ./cmd/leo
    binary: leo
    ldflags:
      - -s -w -X github.com/blackpaw-studio/leo/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

# Fat darwin binary for the Leo.app bundle (one artifact for both Mac archs).
# replace: false keeps the per-arch darwin binaries, which `leo update` and
# the cask still consume.
universal_binaries:
  - id: leo-universal
    ids: [leo]
    replace: false
    name_template: leo

# Sign + notarize the darwin binaries with Apple via quill (built into
# goreleaser), so Gatekeeper accepts browser-downloaded copies. Runs
# cross-platform — no macOS runner needed. Gated on the signing cert being
# present in the environment so local/snapshot builds skip it cleanly.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      # The default is the project name only; the universal build has its own
      # id and must be listed explicitly.
      ids: [leo, leo-universal]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  # Per-arch archives: `leo update` and the cask depend on these names.
  - id: default
    ids: [leo]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Universal darwin archive for Leo.app. .Arch is "all" for universal
  # binaries, so the name is spelled out.
  - id: universal
    ids: [leo-universal]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_universal"

checksum:
  name_template: checksums.txt

# Keyless signing of the checksums file via Sigstore cosign. Identity is
# bound to the GitHub Actions OIDC token for this workflow — no long-lived
# keys are stored anywhere. `leo update` verifies both the signature and
# the issuing identity before trusting checksums.txt.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Published as a cask, not a formula: goreleaser is phasing out `brews`,
# and casks quarantine their downloads by default — so Gatekeeper actually
# assesses the (signed + notarized) binary on install, which the old
# formula path never did.
homebrew_casks:
  - name: leo
    # Pin to the per-arch archives; the universal archive would otherwise
    # compete for the same darwin slot.
    ids: [default]
    repository:
      owner: blackpaw-studio
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/blackpaw-studio/leo"
    description: "Supervise persistent Claude Code agents with scheduling and channel plugins"
    license: MIT
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@blackpaw.studio
    url:
      verified: "github.com/blackpaw-studio/leo/releases/download"
    dependencies:
      - formula: tmux
    caveats: |
      leo requires the `claude` CLI at runtime. Install it from:
        https://docs.claude.com/claude-code

      On first run, configure leo with:
        leo setup
