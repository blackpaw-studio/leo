# Pre-seeded config for smoke-test phase C: web enabled like the starter
# config, plus one claude template so a real agent pane can be inspected.
web:
  enabled: true
  bind: 0.0.0.0
  port: 8370
  allowed_hosts: [localhost, 127.0.0.1]

templates:
  probe:
    model: sonnet
    workspace: /home/leo/agents/probe
